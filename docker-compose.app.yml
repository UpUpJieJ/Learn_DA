# Deploy this file only on the application server. The Runner runs on a
# dedicated private host using docker-compose.runner.yml.

services:
  backend:
    build:
      context: ./learn_da
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
    restart: unless-stopped
    env_file:
      - ./deploy/app.env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/learn_da.db}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/app.env}
      ENABLED_APP_MODULES: learning,playground,agent,analytics,learner_state,practice
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RUNNER_URL: ${RUNNER_URL:?Set the private Runner URL in deploy/app.env}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set the shared Runner token in deploy/app.env}
      RUNNER_TIMEOUT_SECONDS: ${RUNNER_TIMEOUT_SECONDS:-7}
      SANDBOX_DOCKER_ENABLED: "false"
      SANDBOX_LOCAL_ENABLED: "false"
      SANDBOX_USE_MOCK_WHEN_DISABLED: "false"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SESSION_SECRET: ${SESSION_SECRET:?Set a 32+ character session secret in deploy/app.env}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - learn_da_data:/app/data
      - learn_da_logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./learn_da_vue
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"

  redis:
    image: ${REDIS_IMAGE:-redis:7-slim}
    restart: unless-stopped
    profiles: ["redis"]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    expose:
      - "6379"

volumes:
  learn_da_data:
  learn_da_logs:
  redis_data:
