# Learn DA 最小 CI 门禁
#
# 目标：补上"提交前手动跑测试"的唯一防线，任何 PR/push 不可新增回归。
# 范围刻意最小化：后端全量 pytest + 内容 lint + Runner 测试 +
# 前端 vitest/type-check/生产构建。不引入 Mypy baseline、依赖审计。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试 + 内容 lint + Runner
    runs-on: ubuntu-latest
    env:
      # settings 必填项（CI 无 .env）；development 模式不触发生产安全校验
      CORS_ORIGINS: http://localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        run: pip install uv

      - name: 后端依赖（uv.lock）
        working-directory: learn_da
        run: uv sync --extra dev --frozen

      - name: 后端全量测试
        working-directory: learn_da
        run: uv run python -m pytest -q

      - name: 内容 lint（课程数与引用图校验）
        working-directory: learn_da
        run: uv run python scripts/content_lint.py

      - name: Runner 依赖（uv.lock）
        working-directory: learn_da_runner
        run: uv sync --extra dev --frozen

      - name: Runner 测试
        working-directory: learn_da_runner
        run: uv run python -m pytest -q

  frontend:
    name: 前端测试 + 类型检查 + 生产构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learn_da_vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: learn_da_vue/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: vitest
        run: npm test -- --run

      # build 内含 vue-tsc type-check，类型错误在此拦截
      - name: 生产构建（含 type-check）
        run: npm run build
