# 阶段 3 Task 5：学习证据驱动 Agent 离线评测集（改版 M4 起为工作区语义）
#
# 覆盖 6 个评测维度：
#   1. evidence_accuracy   证据五态推导准确率（由 Runner verdict + 教学状态推导）
#   2. next_action         下一步动作映射正确性
#   3. hint_escalation     分级提示逐级升高
#   4. code_leak           证据/反馈不泄露历史提交的完整代码
#   5. fallback_class      fallback 原因分类（timeout/429/rate_limit/empty）
#   6. runner_unavailable  Runner 不可用 / 断言未求值不进入 execution_failed
#
# 每条 case 字段：
#   id, dimension, verdict, status, lesson_completed,
#   history_user_turns, expected_state, expected_next_action, expected_hint_level
#
# verdict 取值与 ``app.workspace.service`` 落库的 Runner 结论一致：
#   passed / execution_failed / assertion_failed / null（历史行或未提交）
# status 是教学状态：passed / failed / skipped（断言未求值）/ null

cases:
